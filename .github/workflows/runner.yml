name: 🔗 GHA
on: [push, pull_request, merge_group, workflow_dispatch]

# One run per branch: a newer push or manual dispatch cancels the older run. Release branches (4.*)
# are keyed by commit instead, so every commit there still publishes its SHA-tagged templates.
concurrency:
  group: ci-${{ github.workflow }}-${{ startsWith(github.ref, 'refs/heads/4.') && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # First stage: Only static checks, fast and prevent expensive builds from running.

  # static-checks:
  #   if: ${{ !vars.DISABLE_GODOT_CI || github.run_attempt > 1 || github.event_name == 'workflow_dispatch' }}
  #   name: 📊 Static checks
  #   uses: ./.github/workflows/static_checks.yml

  # Second stage: Run all the builds and some of the tests.
  # Same-repo PRs skip the builds: the push run already builds the same commit. Fork PRs still build.

  android-build:
    name: 🤖 Android
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    #needs: static-checks
    uses: ./.github/workflows/android_builds.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  ios-build:
    name: 🍏 iOS
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # Repo-wide queue across all runs: with max-parallel: 1 in the called workflow, this repo holds at most
    # 2 of the org's 5 macOS runners (one macOS + one iOS job). Queued jobs wait instead of being cancelled.
    concurrency:
      group: ci-macos-runners-ios
      queue: max
    #needs: static-checks
    uses: ./.github/workflows/ios_builds.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  linux-build:
    name: 🐧 Linux
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    #needs: static-checks
    uses: ./.github/workflows/linux_builds.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  macos-build:
    name: 🍎 macOS
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # Repo-wide queue across all runs: with max-parallel: 1 in the called workflow, this repo holds at most
    # 2 of the org's 5 macOS runners (one macOS + one iOS job). Queued jobs wait instead of being cancelled.
    concurrency:
      group: ci-macos-runners-macos
      queue: max
    #needs: static-checks
    uses: ./.github/workflows/macos_builds.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  windows-build:
    name: 🏁 Windows
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    #needs: static-checks
    uses: ./.github/workflows/windows_builds.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  process-templates:
    name: Process templates
    needs: [android-build, ios-build, linux-build, macos-build, windows-build]
    uses: ./.github/workflows/process_templates.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
