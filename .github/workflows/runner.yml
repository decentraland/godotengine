name: 🔗 GHA
# Pushes only build release branches. Feature branches build through their PR (the branch merged into its
# base), or on demand with "Run workflow" while they have no PR yet.
on:
  push:
    branches: ["4.*"]
  pull_request:
  merge_group:
  workflow_dispatch:

# One run per branch or PR: a newer run cancels the older one. The base branch is keyed by commit instead,
# so every commit there still publishes its SHA-tagged templates (keep in sync with GODOT_BASE_VERSION in
# process_templates.yml).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/4.6.2' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # First stage: Only static checks, fast and prevent expensive builds from running.

  # static-checks:
  #   if: ${{ !vars.DISABLE_GODOT_CI || github.run_attempt > 1 || github.event_name == 'workflow_dispatch' }}
  #   name: 📊 Static checks
  #   uses: ./.github/workflows/static_checks.yml

  # Second stage: Run all the builds and some of the tests.

  android-build:
    name: 🤖 Android
    #needs: static-checks
    uses: ./.github/workflows/android_builds.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  ios-build:
    name: 🍏 iOS
    # Repo-wide queue across all runs: with max-parallel: 1 in the called workflow, this repo holds at most
    # 2 of the org's 5 macOS runners (one macOS + one iOS job). Queued jobs wait instead of being cancelled.
    concurrency:
      group: ci-macos-runners-ios
      queue: max
    #needs: static-checks
    uses: ./.github/workflows/ios_builds.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  linux-build:
    name: 🐧 Linux
    #needs: static-checks
    uses: ./.github/workflows/linux_builds.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  macos-build:
    name: 🍎 macOS
    # Repo-wide queue, see ios-build.
    concurrency:
      group: ci-macos-runners-macos
      queue: max
    #needs: static-checks
    uses: ./.github/workflows/macos_builds.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  windows-build:
    name: 🏁 Windows
    #needs: static-checks
    uses: ./.github/workflows/windows_builds.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  process-templates:
    name: Process templates
    needs: [android-build, ios-build, linux-build, macos-build, windows-build]
    uses: ./.github/workflows/process_templates.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  # The build jobs stage their binaries in R2 under artifacts/<run_id>/. always() also runs this after a
  # cancelled or failed run, which never reaches the end of Process templates.
  cleanup-r2:
    name: Clean up R2 staging
    needs: [android-build, ios-build, linux-build, macos-build, windows-build, process-templates]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Delete temporary artifacts from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "${R2_BUCKET}" ]; then
            echo "No R2 secrets (fork PR), nothing to clean up."
            exit 0
          fi
          aws s3 rm "s3://${R2_BUCKET}/artifacts/${RUN_ID}/" --recursive --endpoint-url "${R2_ENDPOINT}"
          echo "✓ Cleaned up artifacts/${RUN_ID}/"
